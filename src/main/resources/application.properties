# ====== PostgreSQL DB Configuration ======
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/url_shortener}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ====== Hibernate & JPA Config ======
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# ====== Application Configuration ======
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ====== JWT Configuration ======
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ====== Snowflake Distributed ID Generator ======
snowflake.datacenter-id=${SNOWFLAKE_DATACENTER_ID:1}
snowflake.worker-id=${SNOWFLAKE_WORKER_ID:1}

# ====== Threat Intelligence (Google Safe Browsing) ======
google.safebrowsing.api-key=${SAFE_BROWSING_API_KEY:}
google.safebrowsing.enabled=${SAFE_BROWSING_ENABLED:false}

# ====== Spring AI Ollama Configuration ======
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=llama3

# Optional: Logging
#logging.level.org.hibernate.SQL=DEBUG

